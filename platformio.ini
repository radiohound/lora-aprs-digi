; ============================================================
; LoRa APRS digipeater for the STM32WLE5 (Ebyte E77-400MBL-01 dev board)
; Digipeat only: no GPS, no iGate, no tracking.
; Defaults: src/digi3/config_digi3.h; everything can be changed on the serial port.
; ============================================================
[env:e77_digi]
platform  = ststm32
board     = lora_e5_dev_board
board_build.mcu = stm32wle5cc
framework = arduino

; The last 2 KB flash page holds the saved settings, so the linker may not use it (256 KB chip: 262144 - 2048).
board_upload.maximum_size = 260096

debug_tool       = stlink
upload_protocol  = stlink

build_src_filter = +<digi3/>
build_flags =
    -I src/digi3
lib_deps =
    jgromes/RadioLib@^7.1.2

monitor_speed = 115200
